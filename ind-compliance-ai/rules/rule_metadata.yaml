version: 0.1.0
rules:
  - rule_id: HR-PARSE-001
    category: hard
    title: Parsed material exposes review-ready evidence units
    source_regulation: material_review_contract
    source_version: v1
  - rule_id: HR-PARSE-002
    category: hard
    title: Parser diagnostics do not block deterministic rule execution
    source_regulation: material_review_contract
    source_version: v1
  - rule_id: HR-NAV-001
    category: hard
    title: TOC navigation metadata is internally consistent when present
    source_regulation: material_review_contract
    source_version: v1
  - rule_id: HR-CTD-001
    category: hard
    title: Explicit Module 3 / CMC material is paired with a quality overview / QOS document
    source_regulation: NMPA_IND_guidance
    source_version: 2024-01
  - rule_id: HR-ECTD-001
    category: hard
    title: eCTD 序列号应为 4 位数字且满足起始值/递增约束
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-002
    category: hard
    title: eCTD 申请编号应符合 x/y/l + 年份 + 流水号格式
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-003
    category: hard
    title: eCTD 叶元素 checksum-type 必须为 MD5 或 md5
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-004
    category: hard
    title: eCTD 信封元素应包含核心必填属性且仅出现一次
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-005
    category: hard
    title: eCTD leaf 路径应满足字符集与长度约束
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-006
    category: hard
    title: eCTD leaf 引用地址应解析到当前提交包中的实际文件
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-007
    category: hard
    title: cn-regional.xml 与 index.xml 的核心 envelope 字段应保持一致
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-008
    category: hard
    title: cn-regional.xml 与 index.xml 的 leaf 引用集合应保持一致
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-009
    category: hard
    title: cn-regional.xml 与 index.xml 的相同 leaf 应保持相同 checksum 描述
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-010
    category: hard
    title: 当前提交包中的实际文件应被 XML leaf 声明完整覆盖
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-011
    category: hard
    title: envelope 中使用受控词汇的字段值应出自对应 cv XML 文件
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-012
    category: hard
    title: eCTD 注册行为类型字段应存在于 envelope 中
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-013
    category: hard
    title: eCTD 序列类型字段应存在于 envelope 中
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-014
    category: hard
    title: eCTD 序列联系人信息应包含姓名、电话和邮箱
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-015
    category: hard
    title: eCTD 核心包结构应包含序列目录、索引文件、模块目录及 util 配置文件
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-016
    category: hard
    title: eCTD 应用根与序列根命名链应和申请编号、序列号一致
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-017
    category: hard
    title: eCTD util 目录应包含关键受控词汇文件和申请注册序列关系文件
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-018
    category: hard
    title: eCTD 申请类型、注册行为类型和序列类型组合应符合 depend-apt-rat-sqt.xml
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-118
    category: hard
    title: eCTD clinical-trial application sequence related-sequence and type semantics must match technical-specification Table 1
    source_regulation: cn_ectd_technical_specification
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-119
    category: hard
    title: eCTD new-drug application sequence related-sequence and type semantics must match technical-specification Table 2
    source_regulation: cn_ectd_technical_specification
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-120
    category: hard
    title: eCTD application/activity/sequence triplets must be compatible with the authoritative dependency matrix
    source_regulation: cn_ectd_technical_specification
    source_version: 2021-09-v1.0
  - rule_id: SR-ECTD-055
    category: soft
    title: eCTD sequence-description must not substitute for regulatory responses, explanatory letters, or questions
    source_regulation: cn_ectd_technical_specification
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-019
    category: hard
    title: eCTD XML 骨架声明的内容文件应使用允许的五类格式
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-020
    category: hard
    title: eCTD 实际目录结构应被 XML 骨架路径前缀覆盖
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-021
    category: hard
    title: eCTD 序列包中不应存在非 scaffold 空文件夹
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-022
    category: hard
    title: eCTD 已声明 PDF 内容文件中不应存在明显占位文档
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-023
    category: hard
    title: eCTD leaf 的 xml:lang 非空值应遵循 ISO639-1，并按 3.5.1 规则完成中文或外文归类
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-024
    category: hard
    title: eCTD 外文参考资料 leaf 应与对应中文资料处于同一目录元素下，且顺序位于中文之后
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-025
    category: hard
    title: eCTD leaf 的生命周期操作值应属于 new、replace、delete、append
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: HR-ECTD-026
    category: hard
    title: eCTD replace 生命周期操作在可唯一匹配前序 leaf 时应保持语言属性类别一致
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: SR-ECTD-009
    category: soft
    title: eCTD 非 STF 场景下的 append 生命周期操作应作为警告处理
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: SR-ECTD-010
    category: soft
    title: eCTD STF 必需章节中的 leaf 应嵌套在研究标签结构下，而非直接挂在章节节点下
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: SR-ECTD-008
    category: soft
    title: 扩展节点仅允许用于生物制品提交序列的3.2.R章节
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: SR-ECTD-011
    category: soft
    title: eCTD 同一序列中相同 checksum 的不同实体文件应优先采用文件复用而非重复提交
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: SR-ECTD-012
    category: soft
    title: 长 PDF 在无显式目录/书签时应保留可消费的超文本导航链接
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: SR-ECTD-013
    category: soft
    title: 同一申请内可解析的 PDF 外部文件超链接目标应指向真实存在的文件
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: SR-ECTD-014
    category: soft
    title: PDF 外部文件超链接目标应保持可解析以避免链接失效或定位错误
    source_regulation: cn_ectd_technical_specification
    source_version: regulation-requirement-matrix-v1
  - rule_id: SR-ECTD-015
    category: soft
    title: eCTD 包内单个文件大小应在验证标准允许范围内
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: SR-ECTD-030
    category: soft
    title: STF XML should not use content-block elements
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-088
    category: hard
    title: STF XML xlink href values must not contain backslashes
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-089
    category: hard
    title: 5.3.7 case report form leafs must not be used when the sequence uses STF
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-090
    category: hard
    title: STF XML files must validate against ich-stf-v2-2.dtd
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-091
    category: hard
    title: 非豁免 PDF 书签动作仅允许 GoTo、GoToR 或 Launch
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-092
    category: hard
    title: 非豁免 PDF 书签不应包含网页、邮箱或其他 URI 外部链接
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-093
    category: hard
    title: cn-regional.xml content references must stay within the same application and current or prior sequence
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-094
    category: hard
    title: cn-regional.xml append operations must not target a replaced leaf
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-095
    category: hard
    title: cn-regional.xml delete operations must not target a replaced leaf
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-096
    category: hard
    title: cn-regional.xml replace operations must not target a replaced leaf
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-097
    category: hard
    title: cn-regional.xml lifecycle operations must not target a deleted leaf
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-098
    category: hard
    title: cn-regional.xml append operations must not target an append leaf
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-099
    category: hard
    title: cn-regional.xml sequence-description must be non-empty and no longer than 120 Chinese characters
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-100
    category: hard
    title: cn-regional.xml non-initial and non-reformat sequence types must not self-reference related-sequence
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-101
    category: hard
    title: cn-regional.xml initial submission and reformat sequence types must self-reference related-sequence
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-102
    category: hard
    title: cn-regional.xml related-sequence must be four digits and not after the current sequence-number
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-103
    category: hard
    title: cn-regional.xml original-number product-number value must be non-empty
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-104
    category: hard
    title: Development safety report first submissions must include one required module-1 safety element
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-105
    category: hard
    title: Development safety report first submissions must not include both module-1 safety elements
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-106
    category: hard
    title: New drug initial or new-indication first submissions must include required module-1 elements
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-107
    category: hard
    title: New drug initial or new-indication first submissions must not include listed forbidden module-1 elements
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-108
    category: hard
    title: Generic drug initial or new-indication first submissions must include required module-1 elements
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-109
    category: hard
    title: Generic drug initial or new-indication first submissions must not include listed forbidden module-1 elements
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-110
    category: hard
    title: Clinical trial initial or new-indication-and-combination first submissions must include required module-1 elements
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-111
    category: hard
    title: Clinical trial initial or new-indication-and-combination first submissions must not include listed forbidden module-1 elements
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-112
    category: hard
    title: cn-regional.xml schema references must point to local util schema files
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-113
    category: hard
    title: cn-regional.xml must validate against the resolved local schema
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-114
    category: hard
    title: Current sequence cn-regional.xml schema-version must not be lower than prior sequences
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-115
    category: hard
    title: Application-level cn-regional.xml envelope values must remain unchanged from the initial sequence
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-116
    category: hard
    title: Regulatory-activity-type must remain unchanged within the same regulatory activity
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-037
    category: hard
    title: cn-regional.xml application-type must match controlled vocabulary
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-038
    category: hard
    title: cn-regional.xml product-type must match controlled vocabulary
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-039
    category: hard
    title: cn-regional.xml regulatory-activity-type must match controlled vocabulary
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-040
    category: hard
    title: cn-regional.xml sequence-type must match controlled vocabulary
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-054
    category: hard
    title: cn-regional.xml leaf titles must be non-empty
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-055
    category: hard
    title: cn-regional.xml new, replace, and append leafs must have xlink:href
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-056
    category: hard
    title: cn-regional.xml delete leafs must not have xlink:href
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-057
    category: hard
    title: cn-regional.xml replace, delete, and append leafs must reference modified-file targets
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-058
    category: hard
    title: Initial-sequence cn-regional.xml leaf operations must be new
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-059
    category: hard
    title: cn-regional.xml target files must not map to multiple lifecycle operations in one sequence
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-060
    category: hard
    title: cn-regional.xml delete leaf titles must match deleted leaf titles
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-061
    category: hard
    title: cn-regional.xml cn-content elements must contain descendant leafs
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-062
    category: hard
    title: index.xml module elements must contain descendant leafs
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-063
    category: hard
    title: index.xml replace or append content must differ from the modified file
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-064
    category: hard
    title: cn-regional.xml replace or append content must differ from the modified file
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-065
    category: hard
    title: index.xml target files must not map to multiple lifecycle operations in one sequence
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-066
    category: hard
    title: index.xml new, replace, and append leafs must have xlink:href
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-067
    category: hard
    title: index.xml delete leafs must not have xlink:href
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-068
    category: hard
    title: index.xml replace, delete, and append leafs must reference modified-file targets
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-069
    category: hard
    title: index.xml leaf titles must be non-empty
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-070
    category: hard
    title: index.xml delete leaf titles must match deleted leaf titles
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-071
    category: hard
    title: Initial-sequence index.xml leaf operations must be new
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-072
    category: hard
    title: index.xml modified-file targets must exist when comparable history is available
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-073
    category: hard
    title: index.xml href and modified-file references must use relative paths
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-074
    category: hard
    title: index.xml node-extension usage must satisfy validation-standard constraints
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-075
    category: hard
    title: index.xml indication attributes must be present where required
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-076
    category: hard
    title: index.xml manufacturer attributes must be present where required
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-077
    category: hard
    title: index.xml substance attributes must be present where required
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-078
    category: hard
    title: index.xml DTD reference must point to the local util DTD
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-079
    category: hard
    title: index.xml must be valid against the resolved local DTD
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-080
    category: hard
    title: index.xml append operations must not branch replaced leaf lifecycle
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-081
    category: hard
    title: index.xml delete operations must not branch replaced leaf lifecycle
    source_regulation: cn_ectd_validation_standard
    source_version: 2021-09-v1.0
  - rule_id: HR-ECTD-082
    category: hard
    title: index.xml replace operations must not branch replaced leaf lifecycle
